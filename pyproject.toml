[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-block-demo"
version = "0.1.0"
description = "Single-arm SO-101 block manipulation in MuJoCo"
requires-python = ">=3.12,<3.13"
dependencies = ["mujoco==3.3.7", "numpy>=2,<3", "scipy>=1.14,<2", "imageio>=2.36,<3", "imageio-ffmpeg>=0.5,<1"]

[project.optional-dependencies]
vla = ["lerobot[smolvla]==0.4.3"]
robosuite = ["robosuite @ https://github.com/ARISE-Initiative/robosuite/archive/5ce6643f3092639d08f7b0f90ed1c6a84f50552c.tar.gz"]
dev = ["pytest>=8,<10"]

[project.scripts]
so101-demo = "so101_demo.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
